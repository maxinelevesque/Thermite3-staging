[[evolution]]
rfc = "0012-interference-clauses.md"
fragment = "rfc12-interference-v1"
change = "expand"
classifier = "gates/language-completeness-inventory.toml#id = \"rfc12-interference\""
inclusion = ".design/versioned-language-completeness.md#RFC-12 interference clauses now have"
support_matrix = "thermite-spec/src/interference.rs#MonotoneKind"
