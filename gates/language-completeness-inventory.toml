[[gap]]
id = "GAP-LANGUAGE-WIDE-THEOREM"
claimed = "The language prose describes sound checked behavior without a versioned whole-language fragment."
observed = "Existing Lean theorems cover named feature fragments, especially RFC-10, not every parser construct."
trust_consequence = "Readers can mistake feature-local soundness for language-wide coverage."
disposition = "issue_48"
evidence = ["lean/Thermite/CheckedTraversal.lean"]

[[gap]]
id = "GAP-CORRESPONDENCE-BOUNDARY"
claimed = "Generated evidence corresponds to source semantics across the advertised route."
observed = "Correspondence is checked at several boundaries but no general producer/serialization refinement closes the chain."
trust_consequence = "The producer and wire-format correspondence remain trusted outside named checks."
disposition = "issue_48"
evidence = ["thermite-lower/src/witness.rs", "forge/src/manifest.rs"]

[[gap]]
id = "GAP-TOTAL-PRODUCER"
claimed = "Every spec function is executable and an L1 fallback always exists."
observed = "No language-wide total logical producer theorem or exact sufficient-budget refinement is recorded."
trust_consequence = "Operational production limits may be read as semantic exclusion."
disposition = "issue_48"
evidence = ["thermite-lower/src/witness.rs"]

[[gap]]
id = "GAP-POLICY-FRAGMENT"
claimed = "Effects and contract-quality policy are enforced."
observed = "Executable checks exist, but their finite completeness fragment and outside-fragment result are not formalized."
trust_consequence = "Policy refusal can be confused with semantic or evidence failure."
disposition = "issue_48"
evidence = ["forge/src/sandbox.rs", "forge/src/vacuity.rs"]

[[gap]]
id = "GAP-TOTAL-STAGE-OUTCOMES"
claimed = "The verdict map never silently converts results."
observed = "Verdicts are structured, but there is no closed language-wide outcome vocabulary for every attempted stage."
trust_consequence = "Missing tools, resource limits, unsupported syntax, and proof failure lack one checked separation theorem."
disposition = "issue_48"
evidence = ["forge/src/engine.rs"]

[[gap]]
id = "GAP-VERSIONED-FRAGMENTS"
claimed = "Named fragments characterize supported verification inputs."
observed = "A neutral immutable version family now exists and RFC-10 refines into v1, but no later version or language-wide coverage theorem exists yet."
trust_consequence = "A later narrowing could silently reuse an old completeness name."
disposition = "issue_48"
evidence = ["lean/Thermite/CheckedTraversal.lean"]

[[gap]]
id = "GAP-RFC3-MIGRATION"
claimed = "Certification is a scope/refutation/trust@boundary coordinate rather than an Lx ladder."
observed = "Trust and scope data are partial; Level remains live and classification/refutation are not fully persisted."
trust_consequence = "The scalar projection can continue to conflate incomparable assurance positions."
disposition = "issue_48"
evidence = ["forge/src/manifest.rs", ".design/rfcs/0003-certification-surface.md"]

[[gap]]
id = "GAP-CLAIM-EVIDENCE-CLOSURE"
claimed = "Shipped requirement evidence identifies implemented behavior."
observed = "Registry links are checked structurally, not as a proof that each prose claim follows from its evidence."
trust_consequence = "A present evidence path can be mistaken for semantic entailment."
disposition = "issue_48"
evidence = ["gates/req-registry.py"]

