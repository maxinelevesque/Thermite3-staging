# This conservative profile states what the repository can honestly claim for
# every parser construct before issue 48 supplies per-fragment theorems. Parser
# admission and validation are executable; every stronger stage is partial.
[[profile]]
id = "current-language"
parser = "supported"
validator = "partial"
canonical_semantics = "partial"
checked_ir = "partial"
lowering = "partial"
proof_route = "partial"
policy = "partial"
certification = "partial"
evidence = [
  "thermite-syntax/src/parser.rs",
  "thermite-spec/src/validator.rs",
  "thermite-syntax/src/semantic.rs",
  "thermite-lower/src/lower.rs",
  "forge/src/engine.rs",
]

