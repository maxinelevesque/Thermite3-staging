[[gap]]
id = "GAP-LANGUAGE-WIDE-THEOREM"
status = "open"
stages = ["canonical_semantics", "checked_ir", "lowering", "proof_route", "certification"]
counterexample = "Any parser-admitted construct outside the named core/RFC-10 fragments, such as Item::Concurrent."
claimed = "The language prose describes sound checked behavior without a versioned whole-language fragment."
observed = "Existing Lean theorems cover named feature fragments, especially RFC-10, not every parser construct."
trust_consequence = "Readers can mistake feature-local soundness for language-wide coverage."
disposition = "bounded_exclusion"
boundary = "Strong theorems apply only to explicitly named versioned fragments; no whole-parser-language completeness claim is made."
evidence = ["lean/Thermite/CheckedTraversal.lean"]

[[gap]]
id = "GAP-CORRESPONDENCE-BOUNDARY"
status = "open"
stages = ["lowering", "proof_route", "certification"]
counterexample = "A source-to-certificate route whose producer refinement is proved but whose external solver/toolchain correspondence is assumed."
claimed = "Generated evidence corresponds to source semantics across the advertised route."
observed = "Correspondence is checked at several boundaries but no general producer/serialization refinement closes the chain."
trust_consequence = "The producer and wire-format correspondence remain trusted outside named checks."
disposition = "bounded_exclusion"
boundary = "Only the producer/serialization and named route boundaries with explicit refinement evidence are claimed; residual source-to-toolchain correspondence remains trusted."
evidence = ["thermite-lower/src/witness.rs", "forge/src/manifest.rs"]

[[gap]]
id = "GAP-TOTAL-PRODUCER"
status = "resolved"
stages = ["checked_ir", "lowering"]
counterexample = "An admitted traversal at one below its exact semantic-node witness budget."
claimed = "Every spec function is executable and an L1 fallback always exists."
observed = "The logical producer is total on its named fragment and the Rust producer refines it at the exact sufficient budget; one below remains ResourceLimit."
trust_consequence = "Operational production limits may be read as semantic exclusion."
evidence = ["thermite-lower/src/witness.rs"]
resolution_evidence = ["lean/Thermite/CheckedTraversal.lean", "thermite-lower/tests/traversal_witness.rs"]

[[gap]]
id = "GAP-POLICY-FRAGMENT"
status = "resolved"
stages = ["policy"]
counterexample = "A mutation score with 65 scored mutants, outside the checked 1..64 finite policy domain."
claimed = "Effects and contract-quality policy are enforced."
observed = "The 1..64 exact-ratio policy domain is total; malformed or over-cap inputs return UnsupportedPolicy without changing semantic membership."
trust_consequence = "Policy refusal can be confused with semantic or evidence failure."
evidence = ["forge/src/sandbox.rs", "forge/src/vacuity.rs"]
resolution_evidence = ["forge/src/outcome_matrix.rs", "lean/Thermite/LanguageCompleteness.lean"]

[[gap]]
id = "GAP-TOTAL-STAGE-OUTCOMES"
status = "resolved"
stages = ["parser", "validator", "canonical_semantics", "checked_ir", "lowering", "proof_route", "policy", "certification"]
counterexample = "A proof-route adapter reporting both resource exhaustion and counterexample."
claimed = "The verdict map never silently converts results."
observed = "A closed ten-way classifier covers every stage and contradictory adapter facts fail closed to SoundnessAlarm."
trust_consequence = "Missing tools, resource limits, unsupported syntax, and proof failure lack one checked separation theorem."
evidence = ["forge/src/engine.rs"]
resolution_evidence = ["forge/src/outcome_matrix.rs", "gates/language-outcome-matrix.json"]

[[gap]]
id = "GAP-VERSIONED-FRAGMENTS"
status = "resolved"
stages = ["canonical_semantics", "checked_ir"]
counterexample = "A core executable Fn admitted before the spec-only narrowing and excluded afterward."
claimed = "Named fragments characterize supported verification inputs."
observed = "Same-lineage expansion has an inclusion theorem; narrowing changes lineage and carries an admitted-before/excluded-after witness."
trust_consequence = "A later narrowing could silently reuse an old completeness name."
evidence = ["lean/Thermite/CheckedTraversal.lean"]
resolution_evidence = ["lean/Thermite/LanguageCompleteness.lean", "lean/Thermite/PinLanguageNarrowing.lean"]

[[gap]]
id = "GAP-RFC3-MIGRATION"
status = "open"
stages = ["certification"]
counterexample = "Two certificates with equal L3 projection but different engine/trust profiles."
claimed = "Certification is a scope/refutation/trust@boundary coordinate rather than an Lx ladder."
observed = "Checked Kani, runtime L1, and homogeneous general-Verus lowering now bind the attempted source and route metadata in opaque artifacts, fix a route classifier before execution, persist coherent RFC-3 pairs on success and failure/non-claim, and require live producer validation before audit projection. General-Verus main cache replay is domain-separated from auxiliary queries, must match the fresh artifact without restoring audit authority, and decodes through a fail-closed typed outcome adapter. Verus, Lean fallback, EPR, vacuity, and mutation now share a typed precedence relation; partial EPR evidence stays outside the authoritative item certificate, policy rejection is preserved, disagreement alarms symmetrically, and accepted replacements retain exact boundary/policy context. Mixed clause solver routes, project aggregation, and displays still keep Level live."
trust_consequence = "The scalar projection can continue to conflate incomparable assurance positions."
disposition = "current_project"
tracking_requirement = "REQ-COMPLETE-RFC3-COORDINATES"
evidence = ["forge/src/manifest.rs", "forge/src/kani.rs", "forge/src/check.rs", "forge/src/result_arbiter.rs", "forge/src/audit.rs", "thermite-lower/src/l1.rs", "thermite-lower/src/l3.rs", ".design/rfcs/0003-certification-surface.md"]

[[gap]]
id = "GAP-CLAIM-EVIDENCE-CLOSURE"
status = "resolved"
stages = ["certification"]
counterexample = "A shipped registry row citing an existing file whose contents do not entail the requirement summary."
claimed = "Shipped requirement evidence identifies implemented behavior."
observed = "Registry links are checked structurally, not as a proof that each prose claim follows from its evidence."
trust_consequence = "A present evidence path can be mistaken for semantic entailment."
issue = "https://github.com/maxinelevesque/Thermite3-staging/issues/48"
review_item = "CR-001"
evidence = ["gates/completeness-review.py", "gates/claim-closure-author.py"]
resolution_evidence = ["gates/claim-closure-meta.py", "gates/claim-closure-oracles/self-governance.json", "gates/tests/test_claim_closure_author.py", "gates/tests/test_completeness_review.py"]

